name: Build and deploy to SiteGround

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siteground-production
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run SEO checks
        run: npm run seo:check

      - name: Build static website
        run: npm run build

      - name: Configure SiteGround SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SITEGROUND_SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SITEGROUND_SSH_PASSPHRASE }}
          SSH_HOST: ${{ secrets.SITEGROUND_SSH_HOST }}
          SSH_PORT: ${{ secrets.SITEGROUND_SSH_PORT }}
          SSH_USER: ${{ secrets.SITEGROUND_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.SITEGROUND_DEPLOY_PATH }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/siteground_key
          chmod 600 ~/.ssh/siteground_key

          # Remove the passphrase only on this temporary GitHub runner.
          # The original SiteGround key remains password protected.
          ssh-keygen \
            -p \
            -P "$SSH_PASSPHRASE" \
            -N "" \
            -f ~/.ssh/siteground_key

          ssh-keyscan -H -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Confirm that GitHub can connect to SiteGround.
          ssh \
            -i ~/.ssh/siteground_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SiteGround SSH connection successful'"

          # Confirm that the deployment directory actually exists.
          ssh \
            -i ~/.ssh/siteground_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "test -d '$DEPLOY_PATH' && echo 'Deployment directory confirmed: $DEPLOY_PATH'"

      - name: Deploy website to SiteGround
        env:
          SSH_HOST: ${{ secrets.SITEGROUND_SSH_HOST }}
          SSH_PORT: ${{ secrets.SITEGROUND_SSH_PORT }}
          SSH_USER: ${{ secrets.SITEGROUND_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.SITEGROUND_DEPLOY_PATH }}
        run: |
          set -e

          rsync -az --delete \
            --exclude '.well-known/' \
            --exclude 'php_errorlog' \
            -e "ssh -i ~/.ssh/siteground_key -p $SSH_PORT" \
            dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Deployment complete
        run: |
          echo "mohfatemi.com deployment completed successfully."
